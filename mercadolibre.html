<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Libre | Autopartes Toro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 400: '#10b981', 500: '#059669', 950: '#022c22' } } } } }
  </script>
</head>
<body class="min-h-full flex flex-col font-sans bg-slate-900 text-slate-100 antialiased">
  <div class="min-h-screen w-full flex flex-col lg:flex-row relative">
    <button id="mobileToggle" class="lg:hidden absolute top-4 left-4 z-50 p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-emerald-400"><i class="fa-solid fa-bars"></i></button>

    <aside id="sidebar" class="w-20 bg-slate-950 border-r border-slate-800 p-4 flex flex-col justify-between shrink-0 transition-all duration-300 fixed lg:static inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0">
      <div class="space-y-6">
        <div class="flex items-center justify-between px-1 py-1">
          <div class="flex items-center gap-3 text-xl font-bold text-white overflow-hidden">
            <span class="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 grid place-items-center font-black shrink-0">T</span>
            <span class="sidebar-text hidden whitespace-nowrap text-sm tracking-wide">Sistema Cotizaciones</span>
          </div>
          <button id="collapseBtn" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"><i class="fa-solid fa-bars-staggered"></i></button>
        </div>
        
        <nav class="space-y-1.5">
          <a href="index.html" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
            <i class="fa-solid fa-chart-line text-base shrink-0"></i><span class="sidebar-text hidden whitespace-nowrap">Dashboard</span>
          </a>
          <a href="cotizaciones.html" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
            <i class="fa-solid fa-file-invoice-dollar text-base shrink-0"></i><span class="sidebar-text hidden whitespace-nowrap">Cotizaciones</span>
          </a>
          <a href="pedidos.html" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
            <i class="fa-solid fa-boxes-packing text-base shrink-0"></i><span class="sidebar-text hidden whitespace-nowrap">Pedidos Especiales</span>
          </a>
          <a href="mercadolibre.html" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-xs font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 transition">
            <i class="fa-solid fa-store text-base shrink-0"></i><span class="sidebar-text hidden whitespace-nowrap">Mercado Libre</span>
          </a>
          <a href="analisis.html" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
            <i class="fa-solid fa-chart-pie text-base shrink-0"></i><span class="sidebar-text hidden whitespace-nowrap">Análisis</span>
          </a>
        </nav>
      </div>
      <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5 text-xs text-slate-300 overflow-hidden">
          <span class="w-7 h-7 rounded-full bg-emerald-950 text-emerald-400 flex items-center justify-center font-bold shrink-0 border border-emerald-500/30" id="userInitial">U</span>
          <span id="welcomeUser" class="sidebar-text hidden truncate font-medium">Usuario</span>
        </div>
        <button id="logout" title="Cerrar Sesión" class="p-2 text-slate-400 hover:text-white text-xs transition"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </aside>

    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-950/70 z-30 hidden lg:hidden"></div>

    <main class="flex-1 flex flex-col overflow-y-auto p-4 sm:p-8 space-y-6 pt-16 lg:pt-8 bg-slate-900">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white">Pedidos Mercado Libre</h1>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">

        <section class="lg:col-span-1 p-5 rounded-2xl bg-slate-800/80 border border-slate-700 shadow-sm space-y-4">
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-plus text-emerald-400"></i> Registrar Enlace
          </h3>
          <form id="mlForm" class="space-y-3">
            <div>
              <label class="block text-[11px] font-semibold text-slate-300 uppercase tracking-wider mb-1">URL del Pedido</label>
              <input type="url" id="mlUrlInput" required placeholder="https://www.mercadolibre.com.mx/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div class="pt-1">
              <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-md transition">Guardar Enlace</button>
            </div>
          </form>
        </section>

        <section class="lg:col-span-3 p-6 rounded-2xl bg-slate-800/80 border border-slate-700 shadow-sm flex flex-col space-y-4">
          <h3 class="text-sm font-bold text-white">Historial de Enlaces de Mercado Libre</h3>
          <div class="w-full overflow-x-auto rounded-xl border border-slate-700/80">
            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr class="bg-slate-900/90 border-b border-slate-700 text-slate-400 uppercase text-[10px] tracking-wider">
                  <th class="p-3.5">Fecha de Registro</th>
                  <th class="p-3.5">Enlace del Pedido</th>
                  <th class="p-3.5 text-right">Acción</th>
                </tr>
              </thead>
              <tbody id="mlTableBody" class="divide-y divide-slate-700/60 bg-slate-900/30"></tbody>
            </table>
            <div id="emptyMlView" class="text-center text-slate-400 py-8 text-xs font-medium">No hay enlaces de Mercado Libre registrados.</div>
          </div>
          <div class="flex items-center justify-between pt-3 px-1 text-xs text-slate-400">
            <span id="mlViewPageInfo">Página 1 de 1</span>
            <div class="flex gap-1.5">
              <button id="prevMl" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 disabled:opacity-30 hover:bg-slate-700 transition">Anterior</button>
              <button id="nextMl" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 disabled:opacity-30 hover:bg-slate-700 transition">Siguiente</button>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
